# main 에 올라오면 public/ 폴더를 깃허브 페이지로 내보냅니다.
#
# 왜 이 파일이 있나 —
#   깃허브 페이지는 기본으로 저장소 뿌리나 docs/ 만 내보냅니다. 이 저장소는
#   화면이 public/ 에 있어서 그대로는 안 됩니다. 폴더를 옮기면 tools/preview.py ·
#   README · 배포 문서가 다 어긋나므로, 폴더는 그대로 두고 여기서 public/ 만
#   집어 올립니다.
#
# 그 전에는 Cloudflare Pages 에 `npx wrangler pages deploy` 로 손수 올렸습니다.
# 2026-09-08 에 깃허브 한 곳으로 모으기로 하면서 이쪽으로 옮겼습니다.
#
# 2026-10-12 — 내보내기 전에 tools/bake.py 로 시트를 새로 굽고, 하루 네 번 저절로 돈다.
#   손으로 굽는 걸 잊으면 data/campaigns.json(홈도 읽는다)이 9/18 것 그대로 남아 있었다.
#   구운 것은 저장소에 커밋하지 않는다 — 봇 커밋이 쌓이면 GPT 와 pull 이 엇갈린다.
#   그래서 저장소의 public/data 는 사는 화면보다 늦을 수 있다. 진짜는 사는 화면이다.

name: 사이트 배포 (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:      # 손으로도 돌릴 수 있게 (Actions 탭 › Run workflow)
  schedule:
    - cron: '0 21,3,9,15 * * *'   # 한국 시각 06·12·18·24시

# 페이지를 배포하는 데 필요한 최소 권한입니다.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 남깁니다. 돌고 있는 것은 끊지 않습니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # 시트에서 사업·글·사진을 새로 굽는다. 못 받으면 있던 사본을 그대로 둔다.
      # 굽기가 깨져도 화면 배포는 막지 않는다.
      - run: python3 tools/bake.py
        continue-on-error: true
        env:
          TZ: Asia/Seoul    # '구운때' 를 한국 시각으로

      # public/ 안의 것만 올라갑니다. functions/ · intake/ · tools/ 는 안 나갑니다.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
