# Cloudflare Pages 설정
# 배포는 Claude 가 직접 한다(2026-09-09, 사용자 지시로 'GPT 담당' 문구를 걷었다).

name = "dokseong"
pages_build_output_dir = "public"

# workerd 호환 날짜. 예산게임에서 이 날짜를 미래로 잡았다가 런타임이
# 안 뜬 적이 있으므로 함부로 올리지 말 것.
compatibility_date = "2026-05-15"

[vars]
# ⚠️ 2026-09-04 부터 아래 vars 는 **아무도 읽지 않는다.** 제보를 구글 시트로 받게
#    바뀌면서 functions/api/ 를 부르지 않기 때문이다.
#
#    ★ 분기가 바뀌면 여기가 아니라 **intake/Code.gs 의 CURRENT_ROUND** 를 올리고
#      Apps Script 를 새 버전으로 배포해야 한다. 여기만 올리면 시트는 계속 옛 회차로
#      제보를 쌓는다. 같은 값이 두 곳에 있는 것이 함정이라 적어 둔다.
#    ★ 제보를 닫는 것도 여기가 아니라 index.html 의 DOK_SHEET_ENDPOINT 를 비우면 된다.
#
#    D1·R2 를 되살릴 때를 위해 지우지 않고 남겨 둔다.

# 지금 진행 중인 회차. (죽은 값 — 위 경고 참고)
CURRENT_ROUND = "41"
# 제보 접수 여부. "0"으로 두면 폼이 닫힌다. (죽은 값 — 위 경고 참고)
REPORT_OPEN = "1"
# 이번 차수 마감. 제보는 상시로 받되, 이 날짜까지 들어온 것을 한 묶음으로 본다.
# 지나도 접수는 계속되고 다음 차수로 넘어간다.
REPORT_DEADLINE = "2026-09-15"
REPORT_DEADLINE_LABEL = "하반기 1차 제보 마감"

[[d1_databases]]
binding = "DB"
database_name = "dokseong"
# ⚠️ `wrangler d1 create dokseong` 실행 후 나오는 값으로 교체
database_id = "6f74066f-e056-4a08-a6f9-70b8a49a14c1"

# 제보 사진. D1에는 파일을 넣을 수 없어 R2를 쓴다.
#
# 2026-09-07 배포 계정에서 버킷이 없는 것을 확인해 바인딩은 잠시 꺼 둡니다.
# 현재 공개 화면은 Google Sheet 접수처를 사용하므로 이 바인딩을 읽지 않습니다.
#
# ⚠️ 이 버킷은 비공개입니다. 공개 주소를 열지 마세요 — 제보 사진은
#    내부 확인용이고 사람 얼굴·차량번호가 찍혀 들어옵니다.
# ⚠️ 사진은 계속 쌓입니다. 보관 기간을 정해 지우지 않으면 언젠가
#    무료 한도를 넘습니다(10GB ≈ 사진 1만 장).
#
# 끄려면 아래 세 줄을 주석으로 되돌리면 됩니다. 그러면 사진은 저장되지
# 않고 글만 접수됩니다(report.js 가 PHOTOS 바인딩이 없으면 건너뜁니다).
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "dokseong-photos"
